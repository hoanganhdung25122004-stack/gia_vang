name: Daily Gold Price & Macro Update (1x/Day)

on:
  schedule:
    # Chạy tự động mỗi ngày 1 lần lúc 01:30 UTC (tức 08:30 sáng giờ Việt Nam GMT+7)
    - cron: '30 1 * * *'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công bất cứ lúc nào trên GitHub

permissions:
  contents: write

jobs:
  update-gold-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Quantitative Gold & Macro Update Engine
        run: python scripts/update_gold_data.py

      - name: Commit and Push updated Gold Data
        run: |
          git config --global user.name "Gold Market Auto-Updater"
          git config --global user.email "actions@github.com"
          git add data/gold_data.json data/gold_data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update daily gold prices, macro factors & scenarios [skip ci]" && git push)

